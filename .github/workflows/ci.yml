name: CI

on:
  push:
    branches: [ "main", "fix/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32v1-none
      - run: cargo build --release --target wasm32v1-none
      - run: cargo test
